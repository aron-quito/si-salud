<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SI-SALUD · Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">

      <div class="login-logo">
        <div class="logo-mark">🏥</div>
        <h1>SI-SALUD</h1>
        <p>Sistema Integral de Citas Médicas</p>
      </div>

      <div class="demo-hint">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
          <div><strong>Demo:</strong> clave <code>demo123</code></div>
          <span style="font-size:0.75rem;color:var(--text-muted);">10 usuarios BD</span>
        </div>
        <div class="demo-filter-tabs" style="display:flex;gap:4px;margin-bottom:8px;">
          <button type="button" class="tab-chip active" onclick="filterDemo('all', this)">Todos (10)</button>
          <button type="button" class="tab-chip" onclick="filterDemo('paciente', this)">Pacientes (5)</button>
          <button type="button" class="tab-chip" onclick="filterDemo('medico', this)">Médicos (3)</button>
          <button type="button" class="tab-chip" onclick="filterDemo('staff', this)">Staff (2)</button>
        </div>
        <div class="demo-accounts" id="demoAccounts" style="max-height:190px;overflow-y:auto;padding-right:4px;">
          <!-- Pacientes -->
          <button type="button" class="demo-account-btn" data-role="paciente" onclick="fillLogin('juan.perez@gmail.com', this)">
            <span>👤</span>
            <div style="flex:1">
              <div><strong>Juan Pérez</strong> · Paciente 1</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">DNI 45231987 · Medicina General</small>
            </div>
          </button>
          <button type="button" class="demo-account-btn" data-role="paciente" onclick="fillLogin('maria.lopez@gmail.com', this)">
            <span>👤</span>
            <div style="flex:1">
              <div><strong>María López</strong> · Paciente 2</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">DNI 52108743 · Pediatría</small>
            </div>
          </button>
          <button type="button" class="demo-account-btn" data-role="paciente" onclick="fillLogin('carlos.mendoza@gmail.com', this)">
            <span>👤</span>
            <div style="flex:1">
              <div><strong>Carlos Mendoza</strong> · Paciente 3</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">DNI 67342198 · Triaje Urgencia</small>
            </div>
          </button>
          <button type="button" class="demo-account-btn" data-role="paciente" onclick="fillLogin('ana.flores@gmail.com', this)">
            <span>👤</span>
            <div style="flex:1">
              <div><strong>Ana Flores</strong> · Paciente 4</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">DNI 43218976 · Adulto</small>
            </div>
          </button>
          <button type="button" class="demo-account-btn" data-role="paciente" onclick="fillLogin('luis.garcia@gmail.com', this)">
            <span>👤</span>
            <div style="flex:1">
              <div><strong>Luis García</strong> · Paciente 5</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">DNI 71234098 · Adulto</small>
            </div>
          </button>

          <!-- Médicos -->
          <button type="button" class="demo-account-btn" data-role="medico" onclick="fillLogin('dr.torres@sisalud.pe', this)">
            <span>🩺</span>
            <div style="flex:1">
              <div><strong>Dr. Roberto Torres</strong> · Médico</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">Medicina General · Cardiología</small>
            </div>
          </button>
          <button type="button" class="demo-account-btn" data-role="medico" onclick="fillLogin('dra.quispe@sisalud.pe', this)">
            <span>🩺</span>
            <div style="flex:1">
              <div><strong>Dra. Patricia Quispe</strong> · Médica Jefe</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">Pediatría · Medicina General</small>
            </div>
          </button>
          <button type="button" class="demo-account-btn" data-role="medico" onclick="fillLogin('dr.vargas@sisalud.pe', this)">
            <span>🩺</span>
            <div style="flex:1">
              <div><strong>Dr. Alejandro Vargas</strong> · Médico Residente</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">Neurología · Traumatología</small>
            </div>
          </button>

          <!-- Staff -->
          <button type="button" class="demo-account-btn" data-role="staff" onclick="fillLogin('admin@sisalud.pe', this)">
            <span>⚙️</span>
            <div style="flex:1">
              <div><strong>Admin SI-SALUD</strong> · Administrador</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">Control total · Asignación · Lab U1</small>
            </div>
          </button>
          <button type="button" class="demo-account-btn" data-role="staff" onclick="fillLogin('caja.central@sisalud.pe', this)">
            <span>💳</span>
            <div style="flex:1">
              <div><strong>Cajero Central</strong> · Admisión</div>
              <small style="color:var(--text-muted);font-size:0.72rem;">Check-in físico · Emisión de Tickets</small>
            </div>
          </button>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input id="email" type="email" class="form-control" placeholder="usuario@sisalud.pe" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input id="password" type="password" class="form-control" placeholder="demo123" required />
        </div>
        <div id="loginError" class="text-danger text-sm mb-2 hidden"></div>
        <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">
          Ingresar
        </button>
      </form>

      <div style="margin-top:1.25rem;text-align:center;border-top:1px solid var(--border);padding-top:1rem;">
        <a href="/pages/mockups.html" style="color:var(--primary);text-decoration:none;font-size:0.85rem;display:inline-flex;align-items:center;gap:0.4rem;">
          <span>🖼️</span> <strong>Ver Galería de Mockups UI (16 pantallas)</strong> →
        </a>
      </div>
    </div>
  </div>

  <style>
    .tab-chip {
      padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 500;
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted);
      cursor: pointer; transition: all .15s;
    }
    .tab-chip.active, .tab-chip:hover {
      background: var(--primary-glow); border-color: var(--primary); color: var(--primary);
    }
    .demo-account-btn { cursor: pointer; border: 1px solid var(--border); transition: border-color .2s; }
  </style>
  <script src="/js/api.js"></script>
  <script>
    // Si ya tiene sesión, redirigir
    API.me().then(user => redirectByRole(user)).catch(() => {});

    function filterDemo(role, btn) {
      document.querySelectorAll('.tab-chip').forEach(c => c.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const items = document.querySelectorAll('.demo-account-btn');
      items.forEach(el => {
        if (role === 'all' || el.dataset.role === role) {
          el.style.display = 'flex';
        } else {
          el.style.display = 'none';
        }
      });
    }

    function fillLogin(email, btn) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'demo123';
      document.querySelectorAll('.demo-account-btn').forEach(b => b.style.borderColor = '');
      if (btn) btn.style.borderColor = 'var(--primary)';
    }

    function redirectByRole(user) {
      const routes = { Paciente: '/pages/paciente.html', Medico: '/pages/medico.html',
                       Admin: '/pages/admin.html', Cajero: '/pages/admin.html' };
      location.href = routes[user.rol] || '/';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Ingresando...';

      try {
        const res = await API.login(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        redirectByRole(res.user);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
