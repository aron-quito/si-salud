<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SI-SALUD · Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">

      <div class="login-logo">
        <div class="logo-mark">🏥</div>
        <h1>SI-SALUD</h1>
        <p>Sistema Integral de Citas Médicas</p>
      </div>

      <div class="demo-hint">
        <strong>Demo:</strong> contraseña → <code>demo123</code> para todos los usuarios.
        <div class="demo-accounts" id="demoAccounts">
          <button class="demo-account-btn" onclick="fillLogin('juan.perez@gmail.com')">👤 Juan Pérez · paciente 1</button>
          <button class="demo-account-btn" onclick="fillLogin('maria.lopez@gmail.com')">👤 María López · paciente 2</button>
          <button class="demo-account-btn" onclick="fillLogin('carlos.mendoza@gmail.com')">👤 Carlos Mendoza · paciente 3</button>
          <button class="demo-account-btn" onclick="fillLogin('dr.torres@sisalud.pe')">🩺 Dr. Torres</button>
          <button class="demo-account-btn" onclick="fillLogin('dra.quispe@sisalud.pe')">🩺 Dra. Quispe</button>
          <button class="demo-account-btn" onclick="fillLogin('admin@sisalud.pe')">⚙️ Admin · laboratorio U1</button>
          <button class="demo-account-btn" onclick="fillLogin('caja.central@sisalud.pe')">💳 Cajero · check-in</button>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input id="email" type="email" class="form-control" placeholder="usuario@sisalud.pe" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input id="password" type="password" class="form-control" placeholder="demo123" required />
        </div>
        <div id="loginError" class="text-danger text-sm mb-2 hidden"></div>
        <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">
          Ingresar
        </button>
      </form>

      <div style="margin-top:1.25rem;text-align:center;border-top:1px solid var(--border);padding-top:1rem;">
        <a href="/pages/mockups.html" style="color:var(--primary);text-decoration:none;font-size:0.85rem;display:inline-flex;align-items:center;gap:0.4rem;">
          <span>🖼️</span> <strong>Ver Galería de Mockups UI (16 pantallas)</strong> →
        </a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    // Si ya tiene sesión, redirigir
    API.me().then(user => redirectByRole(user)).catch(() => {});

    function fillLogin(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'demo123';
    }

    function redirectByRole(user) {
      const routes = { Paciente: '/pages/paciente.html', Medico: '/pages/medico.html',
                       Admin: '/pages/admin.html', Cajero: '/pages/admin.html' };
      location.href = routes[user.rol] || '/';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Ingresando...';

      try {
        const res = await API.login(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        redirectByRole(res.user);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
